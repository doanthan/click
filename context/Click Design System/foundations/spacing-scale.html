<!-- @dsCard group="Spacing" viewport="700x160" name="Spacing scale" subtitle="4px base. Generous whitespace - let the copy breathe." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--cream);font-family:var(--font-sans);padding:24px 28px;display:flex;align-items:flex-end;gap:14px}
  .u{display:flex;flex-direction:column;align-items:center;gap:8px}
  .bar{background:var(--lavender-300);border-radius:4px;width:26px}
  .u small{font-size:11px;color:var(--text-muted);font-weight:600}
  .u b{font-size:11px;color:var(--text-strong)}
</style></head>
<body>
  <div class="u"><div class="bar" style="height:8px"></div><b>2</b><small>8</small></div>
  <div class="u"><div class="bar" style="height:12px"></div><b>3</b><small>12</small></div>
  <div class="u"><div class="bar" style="height:16px"></div><b>4</b><small>16</small></div>
  <div class="u"><div class="bar" style="height:24px"></div><b>6</b><small>24</small></div>
  <div class="u"><div class="bar" style="height:32px"></div><b>8</b><small>32</small></div>
  <div class="u"><div class="bar" style="height:48px"></div><b>12</b><small>48</small></div>
  <div class="u"><div class="bar" style="height:64px"></div><b>16</b><small>64</small></div>
  <div class="u"><div class="bar" style="height:80px"></div><b>20</b><small>80</small></div>
</body></html>
