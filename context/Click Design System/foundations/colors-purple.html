<!-- @dsCard group="Colors" viewport="700x180" name="Purple - the brand spine" subtitle="Deep purple #3B2F81 is the base. Full tint/shade ramp." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--cream);font-family:var(--font-sans);padding:22px 24px}
  .row{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm)}
  .sw{flex:1;height:84px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px}
  .sw span{font-size:11px;font-weight:600;letter-spacing:.02em}
  .lbl{margin-top:12px;font-size:12px;color:var(--text-muted);display:flex;justify-content:space-between}
  .lbl b{color:var(--text-strong);font-weight:700}
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--purple-50)"><span style="color:#3B2F81">50</span></div>
    <div class="sw" style="background:var(--purple-100)"><span style="color:#3B2F81">100</span></div>
    <div class="sw" style="background:var(--purple-200)"><span style="color:#3B2F81">200</span></div>
    <div class="sw" style="background:var(--purple-300)"><span style="color:#241C4E">300</span></div>
    <div class="sw" style="background:var(--purple-400)"><span style="color:#fff">400</span></div>
    <div class="sw" style="background:var(--purple-500)"><span style="color:#fff">500</span></div>
    <div class="sw" style="background:var(--purple-600);outline:2px solid var(--cream);outline-offset:-5px"><span style="color:#fff">600 ★</span></div>
    <div class="sw" style="background:var(--purple-700)"><span style="color:#fff">700</span></div>
    <div class="sw" style="background:var(--purple-800)"><span style="color:#fff">800</span></div>
    <div class="sw" style="background:var(--purple-900)"><span style="color:#fff">900</span></div>
  </div>
  <div class="lbl"><span><b>600</b> &nbsp;#3B2F81 &nbsp;- brand primary / <code>--accent</code></span><span><b>900</b> &nbsp;#1C1830 - ink</span></div>
</body></html>
