<!-- @dsCard group="Type" viewport="700x300" name="Display & headings" subtitle="Poppins SemiBold/Bold, tight tracking. Sentence case always." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--cream);font-family:var(--font-sans);padding:26px 28px;color:var(--text-strong)}
  .spec{display:flex;align-items:baseline;gap:16px;padding:9px 0;border-bottom:1px solid var(--border-soft)}
  .spec:last-child{border:0}
  .meta{flex:0 0 120px;font-size:11px;color:var(--text-muted);font-weight:600;letter-spacing:.02em}
  .d,.h1,.h2,.h3{font-family:var(--font-display)}
  .d{font-weight:600;font-size:42px;letter-spacing:-0.02em;line-height:1.05}
  .h1{font-weight:600;font-size:32px;letter-spacing:-0.02em}
  .h2{font-weight:600;font-size:24px;letter-spacing:-0.015em}
  .h3{font-weight:600;font-size:20px;letter-spacing:-0.01em}
</style></head>
<body>
  <div class="spec"><span class="meta">Display · 600</span><span class="d">Show up. See what happens.</span></div>
  <div class="spec"><span class="meta">H1 · 600</span><span class="h1">What's on this week</span></div>
  <div class="spec"><span class="meta">H2 · 600</span><span class="h2">Did you click with anyone?</span></div>
  <div class="spec"><span class="meta">H3 · 600</span><span class="h3">Find something worth showing up to</span></div>
</body></html>
