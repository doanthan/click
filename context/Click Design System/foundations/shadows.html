<!-- @dsCard group="Spacing" viewport="700x180" name="Shadows" subtitle="Soft, low, purple-tinted - never neutral gray, never a glow. Primary CTAs are flat." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--cream);font-family:var(--font-sans);padding:28px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
  .u{display:flex;flex-direction:column;align-items:center;gap:10px}
  .box{width:88px;height:64px;background:var(--white);border-radius:var(--radius-md)}
  .u b{font-size:12px;color:var(--text-strong)}
</style></head>
<body>
  <div class="u"><div class="box" style="box-shadow:var(--shadow-xs)"></div><b>xs</b></div>
  <div class="u"><div class="box" style="box-shadow:var(--shadow-sm)"></div><b>sm</b></div>
  <div class="u"><div class="box" style="box-shadow:var(--shadow-md)"></div><b>md</b></div>
  <div class="u"><div class="box" style="box-shadow:var(--shadow-lg)"></div><b>lg</b></div>
  <div class="u"><div class="box" style="box-shadow:var(--shadow-xl)"></div><b>xl</b></div>
</body></html>
