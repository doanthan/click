<!-- @dsCard group="Colors" viewport="700x150" name="Semantic colors" subtitle="Success, warning, error, info - used sparingly, warm-leaning." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--cream);font-family:var(--font-sans);padding:24px;display:flex;gap:14px;align-items:center}
  .cell{flex:1;border-radius:var(--radius-md);padding:14px 16px;color:#fff;box-shadow:var(--shadow-sm)}
  .cell b{display:block;font-size:14px;font-weight:700}
  .cell span{font-size:12px;opacity:.85}
</style></head>
<body>
  <div class="cell" style="background:var(--success)"><b>Success</b><span>sage #5B8C6E</span></div>
  <div class="cell" style="background:var(--warning)"><b>Warning</b><span>amber #E0A33A</span></div>
  <div class="cell" style="background:var(--error)"><b>Error</b><span>#B5362F</span></div>
  <div class="cell" style="background:var(--info)"><b>Info</b><span>lavender-500</span></div>
</body></html>
