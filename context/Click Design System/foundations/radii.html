<!-- @dsCard group="Spacing" viewport="700x170" name="Corner radii" subtitle="Friendly, generous rounding. Nothing sharp-cornered." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--cream);font-family:var(--font-sans);padding:24px 28px;display:flex;gap:18px;align-items:center}
  .u{display:flex;flex-direction:column;align-items:center;gap:10px}
  .box{width:74px;height:74px;background:var(--white);border:1.5px solid var(--lavender-300);box-shadow:var(--shadow-sm)}
  .u b{font-size:12px;color:var(--text-strong)}
  .u small{font-size:11px;color:var(--text-muted)}
</style></head>
<body>
  <div class="u"><div class="box" style="border-radius:var(--radius-xs)"></div><b>xs</b><small>6px</small></div>
  <div class="u"><div class="box" style="border-radius:var(--radius-sm)"></div><b>sm</b><small>10px</small></div>
  <div class="u"><div class="box" style="border-radius:var(--radius-md)"></div><b>md</b><small>14px</small></div>
  <div class="u"><div class="box" style="border-radius:var(--radius-lg)"></div><b>lg</b><small>20px</small></div>
  <div class="u"><div class="box" style="border-radius:var(--radius-xl)"></div><b>xl</b><small>28px</small></div>
  <div class="u"><div class="box" style="border-radius:var(--radius-pill)"></div><b>pill</b><small>999px</small></div>
</body></html>
