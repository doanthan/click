<!-- @dsCard group="Colors" viewport="700x190" name="Cream, Sand & Ink" subtitle="Warm neutral ground (never stark white) and purple-tinted ink text." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--cream);font-family:var(--font-sans);padding:22px 24px;display:flex;gap:22px}
  .group{flex:1}
  .ttl{font-size:11px;font-weight:700;letter-spacing:var(--tracking-overline);text-transform:uppercase;color:var(--text-muted);margin:0 0 10px}
  .row{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm);border:1px solid var(--border-soft)}
  .sw{flex:1;height:72px;display:flex;align-items:flex-end;padding:7px 9px;font-size:11px;font-weight:600}
  .cap{margin-top:9px;font-size:12px;color:var(--text-muted)}
  .cap b{color:var(--text-strong)}
</style></head>
<body>
  <div class="group">
    <p class="ttl">Cream & sand - ground</p>
    <div class="row">
      <div class="sw" style="background:var(--cream);color:#837C9B">cream</div>
      <div class="sw" style="background:var(--sand-50);color:#837C9B">50</div>
      <div class="sw" style="background:var(--sand-100);color:#837C9B">100</div>
      <div class="sw" style="background:var(--sand-200);color:#463F66">200</div>
      <div class="sw" style="background:var(--sand-300);color:#463F66">300</div>
      <div class="sw" style="background:var(--sand-400);color:#fff">400</div>
    </div>
    <p class="cap"><b>cream</b> #F9F6F0 - the page background</p>
  </div>
  <div class="group">
    <p class="ttl">Ink - text neutrals</p>
    <div class="row">
      <div class="sw" style="background:var(--ink);color:#fff">ink</div>
      <div class="sw" style="background:var(--ink-soft);color:#fff">soft</div>
      <div class="sw" style="background:var(--ink-muted);color:#fff">muted</div>
      <div class="sw" style="background:var(--ink-faint);color:#241C4E">faint</div>
    </div>
    <p class="cap"><b>ink</b> #1C1830 - text-strong · purple-tinted, never black</p>
  </div>
</body></html>
