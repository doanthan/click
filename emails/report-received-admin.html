<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New user report &mdash; safety review</title>
    <style>
      body { margin: 0; padding: 0; width: 100% !important; background: #FFFCF9; }
      table { border-collapse: collapse; }
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
  </head>
  <body style="margin:0;padding:0;background:#FFFCF9;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#FFFCF9;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" style="width:600px;max-width:600px;background:#FFFFFF;border:1px solid #EDE3F0;">
            <tr>
              <td class="sans" style="padding:24px 32px;border-bottom:1px solid #F1E9F2;font-family:'Inter',Helvetica,Arial,sans-serif;font-size:11px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:#B3261E;">
                Safety queue &middot; action required (24hr SLA)
              </td>
            </tr>
            <tr>
              <td class="sans" style="padding:28px 32px 8px 32px;font-family:'Inter',Helvetica,Arial,sans-serif;">
                <h1 style="margin:0 0 16px 0;font-size:22px;font-weight:600;color:#340068;">A user was reported</h1>
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="font-size:14px;color:#2B2330;">
                  <tr><td style="padding:6px 0;width:140px;color:#6D435A;">Report ID</td><td style="padding:6px 0;font-weight:600;">{{reportId}}</td></tr>
                  <tr><td style="padding:6px 0;color:#6D435A;">Reason</td><td style="padding:6px 0;font-weight:600;">{{reason}}</td></tr>
                  <tr><td style="padding:6px 0;color:#6D435A;">Reporter</td><td style="padding:6px 0;font-weight:600;">{{reporterName}}</td></tr>
                  <tr><td style="padding:6px 0;color:#6D435A;vertical-align:top;">Details</td><td style="padding:6px 0;">{{details}}</td></tr>
                </table>
              </td>
            </tr>
            <tr>
              <td class="sans" style="padding:20px 32px 32px 32px;font-family:'Inter',Helvetica,Arial,sans-serif;">
                <a href="/admin/reports" style="display:inline-block;background:#340068;color:#FFFFFF;text-decoration:none;font-size:13px;font-weight:600;padding:12px 22px;border-radius:999px;">Open the moderation queue &rarr;</a>
                <p style="margin:18px 0 0 0;font-size:12px;color:#6D435A;">The reporter has been auto-muted from the reported user. Review and resolve within 24 hours.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
