services:
  postgres:
    image: postgres:16-alpine
    container_name: click-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: click
      POSTGRES_USER: click
      POSTGRES_PASSWORD: click_dev_password
    ports:
      - "5432:5432"
    volumes:
      - click_postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U click -d click"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  click_postgres_data:
